name: BarberOS Vercel Production

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "vercel.json"
      - ".nvmrc"
      - "scripts/validate-deployment-config.mjs"
      - "scripts/verify-production.mjs"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barberos-vercel-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Production preflight
    runs-on: ubuntu-latest
    env:
      DEPLOY_PREFLIGHT: production
      VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - working-directory: frontend
        run: yarn install --frozen-lockfile
      - working-directory: frontend
        run: yarn deploy:contract
      - working-directory: frontend
        run: yarn build
      - working-directory: frontend
        run: yarn perf:budget
      - working-directory: frontend
        run: yarn typecheck

  deploy:
    name: Vercel production deployment
    needs: preflight
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull production project settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"
      - name: Build with production environment
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"
      - name: Deploy prebuilt production artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" | tail -n 1)"
          test -n "$url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"
      - name: Release summary
        run: |
          {
            echo "## BarberOS Vercel production deployment"
            echo
            echo "- Deployment: ${{ steps.deploy.outputs.deployment_url }}"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Production smoke
    needs: deploy
    if: ${{ needs.deploy.result == 'success' && secrets.BARBEROS_PUBLIC_URL != '' }}
    runs-on: ubuntu-latest
    env:
      BARBEROS_PUBLIC_URL: ${{ secrets.BARBEROS_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-production.mjs
