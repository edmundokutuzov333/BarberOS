name: BarberOS Vercel Production

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "vercel.json"
      - ".nvmrc"
      - "scripts/validate-deployment-config.mjs"
      - "scripts/verify-production.mjs"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/tests/**"
      - ".github/workflows/deploy-vercel.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barberos-vercel-production
  cancel-in-progress: true

jobs:
  preflight:
    name: Production preflight
    runs-on: ubuntu-latest
    env:
      DEPLOY_PREFLIGHT: production
      VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID
    steps:
      - uses: actions/checkout@v4
      - name: Repository secret scan
        run: node scripts/scan-repository-secrets.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - working-directory: frontend
        run: corepack yarn install --frozen-lockfile
      - working-directory: frontend
        run: corepack yarn deploy:contract
      - working-directory: frontend
        run: corepack yarn build
      - working-directory: frontend
        run: corepack yarn perf:budget
      - working-directory: frontend
        run: corepack yarn typecheck
      - name: Require the Supabase gateway release before shipping frontend
        shell: bash
        run: |
          set -euo pipefail
          base="https://alseiinjzwjdiwtvkdzy.supabase.co/functions/v1"
          health="$(curl --retry 3 --retry-delay 2 --retry-all-errors --silent --show-error --fail "$base/health")"
          printf '%s' "$health" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              let value;
              try { value = JSON.parse(input); } catch { console.error("Supabase health returned invalid JSON"); process.exit(1); }
              if (value.ok !== true || typeof value.db_ms !== "number" || typeof value.version !== "string" || value.version === "unknown") {
                console.error("Supabase backend release is not certified; frontend deployment is blocked");
                process.exit(1);
              }
            });
          '
          gateway_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request OPTIONS "$base/token-gateway" --header 'Origin: https://barber-os-orpin.vercel.app' --header 'Access-Control-Request-Method: POST')"
          if [ "$gateway_status" != "200" ]; then
            echo "::error::token-gateway is not ready (HTTP $gateway_status); frontend deployment is blocked."
            exit 1
          fi

  deploy:
    name: Vercel production deployment
    needs: preflight
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      deployed: ${{ steps.credentials.outputs.enabled }}
    steps:
      - id: credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Pull production project settings
        if: steps.credentials.outputs.enabled == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"

      - name: Build with production environment
        if: steps.credentials.outputs.enabled == 'true'
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"

      - name: Deploy prebuilt production artifact
        if: steps.credentials.outputs.enabled == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" | tail -n 1)"
          test -n "$url"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"

      - name: Release summary
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          {
            echo "## BarberOS Vercel production deployment"
            echo
            echo "Deployment: ${{ steps.deploy.outputs.deployment_url }}"
            echo "Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Credentials not configured
        if: steps.credentials.outputs.enabled != 'true'
        run: echo "SKIP | Vercel production credentials are not configured in GitHub Actions."

  smoke:
    name: Production smoke
    needs: deploy
    runs-on: ubuntu-latest
    if: needs.deploy.outputs.deployed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production
        env:
          BARBEROS_PUBLIC_URL: ${{ secrets.BARBEROS_PUBLIC_URL }}
        run: node scripts/verify-production.mjs
