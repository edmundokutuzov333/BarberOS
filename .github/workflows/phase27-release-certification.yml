name: BarberOS Phase 27 Isolated Release Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/phase27-release-certification.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/phase23-tests.yml"
      - ".github/workflows/phase24-concurrency.yml"
      - ".github/workflows/phase25-performance.yml"
      - "docs/PRODUCTION_RELEASE_SAFETY.md"
      - "supabase/**"
      - "scripts/test_database_phase23.py"
      - "scripts/test_booking_concurrency_phase23.py"
      - "scripts/test_booking_concurrency_phase24.py"
      - "docs/TESTING.md"
      - "docs/PHASE24-CONCURRENCY.md"
      - "docs/PHASE25-PERFORMANCE.md"
  push:
    branches: [main, "phase-*"]
    paths:
      - ".github/workflows/phase27-release-certification.yml"
      - ".github/workflows/phase23-tests.yml"
      - ".github/workflows/phase24-concurrency.yml"
      - ".github/workflows/phase25-performance.yml"
      - "docs/PRODUCTION_RELEASE_SAFETY.md"
      - "supabase/**"
      - "scripts/test_database_phase23.py"
      - "scripts/test_booking_concurrency_phase23.py"
      - "scripts/test_booking_concurrency_phase24.py"

permissions:
  contents: read

concurrency:
  group: barberos-phase27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-full-lifecycle:
    name: Local auth, shop publishing and booking lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BARBEROS_E2E_FULL: "1"
      BARBEROS_E2E_EPHEMERAL_LOCAL: "1"
      BARBEROS_E2E_EMAIL: qa-owner@barberos.test
      BARBEROS_E2E_PASSWORD: "Local-QA-Only-Password-2026!"
      BARBEROS_E2E_SHOP_SLUG: oryon
      RATE_LIMIT_SALT: barberos-phase27-local-test-salt
      ALLOWED_ORIGINS: http://127.0.0.1:4173
      TURNSTILE_BYPASS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start local Supabase and apply complete migration chain
        shell: bash
        run: |
          set -o pipefail
          supabase start --debug --exclude studio,imgproxy,inbucket,logflare,vector 2>&1 | tee "$RUNNER_TEMP/barberos-e2e-supabase-start.log" || {
            tail -n 120 "$RUNNER_TEMP/barberos-e2e-supabase-start.log"
            exit 1
          }
          supabase db reset
          supabase status -o env > "$RUNNER_TEMP/barberos-local-supabase.env"
      - name: Start local Edge Functions with test-only anti-bot bypass
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/barberos-functions.env" <<'EOF'
          RATE_LIMIT_SALT=barberos-phase27-local-test-salt
          ALLOWED_ORIGINS=http://127.0.0.1:4173
          TURNSTILE_BYPASS=true
          EOF
          supabase functions serve --env-file "$RUNNER_TEMP/barberos-functions.env" --no-verify-jwt > "$RUNNER_TEMP/barberos-edge-functions.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/barberos-edge-functions.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:54321/functions/v1/health > /dev/null; then
              echo "Local Edge Functions are accepting requests."
              exit 0
            fi
            sleep 2
          done
          tail -n 160 "$RUNNER_TEMP/barberos-edge-functions.log"
          exit 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: corepack enable && corepack yarn install --frozen-lockfile
      - name: Build application against local Supabase only
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/barberos-local-supabase.env"
          test -n "$API_URL"
          test -n "$ANON_KEY"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" corepack yarn build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: corepack yarn playwright install --with-deps chromium
      - name: Run full registration, publication, booking, reschedule, agenda, CRM and cancellation flow
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
        run: corepack yarn playwright test tests/e2e/phase23-full-lifecycle.spec.mjs --config=playwright.config.mjs --project=chromium
      - name: Preserve local Supabase and Edge Function logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: barberos-phase27-local-e2e-logs
          path: |
            ${{ runner.temp }}/barberos-e2e-supabase-start.log
            ${{ runner.temp }}/barberos-edge-functions.log
          if-no-files-found: ignore

  isolated-database:
    name: Disposable Supabase acceptance, concurrency and performance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BARBEROS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      BARBEROS_TEST_ALLOW_MUTATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start an isolated local Supabase stack
        shell: bash
        run: |
          set -o pipefail
          supabase start --debug --exclude studio,imgproxy,inbucket,logflare,vector 2>&1 | tee "$RUNNER_TEMP/barberos-supabase-start.log" || {
            tail -n 120 "$RUNNER_TEMP/barberos-supabase-start.log"
            exit 1
          }
      - name: Apply all migrations and seed the disposable database from zero
        run: supabase db reset
      - name: Validate platform security and core contracts
        run: |
          supabase test db \
            supabase/tests/platform_access_security.test.sql \
            supabase/tests/platform_core_contracts.test.sql
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install database test client
        run: pip install "psycopg[binary]==3.2.12"
      - name: Run all database domain acceptance suites
        run: python scripts/test_database_phase23.py
      - name: Run real PostgreSQL booking concurrency acceptance (Phase 23)
        run: python scripts/test_booking_concurrency_phase23.py
      - name: Run deterministic concurrent booking acceptance (Phase 24)
        run: python scripts/test_booking_concurrency_phase24.py
      - name: Run Phase 24 database concurrency contract
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["BARBEROS_TEST_DATABASE_URL"], autocommit=True) as conn:
              conn.execute(open("supabase/tests/phase24_concurrency_contract.sql", encoding="utf-8").read())
          print("PASS | supabase/tests/phase24_concurrency_contract.sql")
          PY
      - name: Run Phase 25 database performance contract and RPC benchmark
        run: |
          python - <<'PY'
          import os
          import psycopg
          files = [
              "supabase/tests/phase25_performance_contract.sql",
              "supabase/tests/phase25_public_rpc_benchmark.sql",
          ]
          with psycopg.connect(os.environ["BARBEROS_TEST_DATABASE_URL"], autocommit=True) as conn:
              for filename in files:
                  conn.execute(open(filename, encoding="utf-8").read())
                  print("PASS | " + filename)
          PY
      - name: Preserve Supabase startup logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: barberos-phase27-supabase-start-log
          path: ${{ runner.temp }}/barberos-supabase-start.log
          if-no-files-found: ignore
