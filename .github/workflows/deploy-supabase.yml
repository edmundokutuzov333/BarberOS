name: BarberOS Supabase Production

# Never apply database migrations to production automatically on pushes to main.
# Release remains blocked until the history and Turnstile gates are explicitly verified.
on:
  workflow_dispatch:
    inputs:
      confirm_production_release:
        description: "Type APPLY-SUPABASE-PRODUCTION to acknowledge a production database release."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: barberos-supabase-production
  cancel-in-progress: false

jobs:
  release:
    name: Supabase production release
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_REF: alseiinjzwjdiwtvkdzy
    steps:
      - name: Require explicit approval and verified staging
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirm_production_release }}
          HISTORY_RECONCILED: ${{ vars.BARBEROS_PRODUCTION_MIGRATION_HISTORY_RECONCILED }}
          TURNSTILE_CONFIGURED: ${{ vars.BARBEROS_TURNSTILE_CONFIGURED }}
          RESEND_CONFIGURED: ${{ vars.BARBEROS_RESEND_CONFIGURED }}
        run: |
          if [ "$CONFIRMATION" != "APPLY-SUPABASE-PRODUCTION" ]; then
            echo "::error::Production release requires the exact confirmation phrase."
            exit 1
          fi
          if [ "$HISTORY_RECONCILED" != "true" ]; then
            echo "::error::Production release blocked: set BARBEROS_PRODUCTION_MIGRATION_HISTORY_RECONCILED=true only after migration history is reconciled and staging has passed."
            exit 1
          fi
          if [ "$TURNSTILE_CONFIGURED" != "true" ]; then
            echo "::error::Production release blocked: configure VITE_TURNSTILE_SITE_KEY and VITE_BOOKING_TURNSTILE_REQUIRED=true in Vercel, TURNSTILE_SECRET_KEY in Supabase, and verify the allowed production origins."
            exit 1
          fi
          if [ "$RESEND_CONFIGURED" != "true" ]; then
            echo "::error::Production release blocked: configure Resend, the sender identity, and the signed webhook secret before switching notifications to email-first."
            exit 1
          fi

      - name: Require Supabase deployment credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is required"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD is required"; exit 1; }

      - uses: actions/checkout@v4

      - name: Repository secret scan
        run: node scripts/scan-repository-secrets.mjs

      - name: Validate release contract
        run: node scripts/verify-supabase-release.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Verify required runtime secrets without printing values
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" > "$RUNNER_TEMP/barberos-supabase-secrets.txt"
          for name in TURNSTILE_SECRET_KEY RATE_LIMIT_SALT ALLOWED_ORIGINS RESEND_API_KEY RESEND_WEBHOOK_SECRET NOTIFICATION_EMAIL_FROM; do
            if ! grep -q "$name" "$RUNNER_TEMP/barberos-supabase-secrets.txt"; then
              echo "::error::Required Supabase runtime secret is missing: $name"
              exit 1
            fi
          done
          echo "Required runtime secret names are present. Values were not read or printed."

      - name: Preview database changes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Stamp release version and deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set "BARBEROS_VERSION=$GITHUB_SHA" --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --retry 5 --retry-delay 2 --retry-all-errors --silent --show-error --fail "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/health")"
          printf '%s' "$response" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(input);
              if (value.ok !== true || typeof value.db_ms !== "number" || typeof value.version !== "string") {
                console.error("Health contract failed");
                process.exit(1);
              }
              console.log(JSON.stringify({ ok: value.ok, db_ms: value.db_ms, version: value.version }));
            });
          '

      - name: Release summary
        run: |
          {
            echo "## BarberOS Supabase production release"
            echo
            echo "Project: $SUPABASE_PROJECT_REF"
            echo "The explicit confirmation, history, and Turnstile gates were satisfied."
            echo "Migrations and Edge Functions were released from main."
          } >> "$GITHUB_STEP_SUMMARY"
