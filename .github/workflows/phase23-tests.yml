name: BarberOS Phase 23 Test Suite

on:
  pull_request:
    paths:
      - "frontend/**"
      - "tests/**"
      - "supabase/tests/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-vercel.yml"
      - "scripts/test_database_phase23.py"
      - "scripts/test_booking_concurrency_phase23.py"
      - "frontend/tests/e2e/phase23-full-lifecycle.spec.mjs"
      - "docs/TESTING.md"
      - ".github/workflows/phase23-tests.yml"
      - "package.json"
      - ".nvmrc"
  push:
    branches:
      - main
      - "phase-*"
    paths:
      - "frontend/**"
      - "tests/**"
      - "supabase/tests/**"
      - "scripts/test_database_phase23.py"
      - "docs/TESTING.md"
      - ".github/workflows/phase23-tests.yml"
      - "package.json"
      - ".nvmrc"

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile
      - name: Accessibility audit
        run: corepack yarn a11y:phase21
      - name: Typecheck
        run: corepack yarn typecheck
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID
        run: corepack yarn build

  unit-components:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: frontend
        run: corepack yarn install --frozen-lockfile
      - name: Unit tests
        working-directory: frontend
        run: corepack yarn test:unit:phase23
      - name: Component tests
        working-directory: frontend
        run: corepack yarn test:components:phase23
      - name: Page contracts
        working-directory: frontend
        run: corepack yarn test:contracts:phase23

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs:
      - frontend
    env:
      BARBEROS_E2E_FULL: ${{ secrets.BARBEROS_E2E_FULL }}
      BARBEROS_E2E_FULL_RESET_URL: ${{ secrets.BARBEROS_E2E_FULL_RESET_URL }}
      BARBEROS_E2E_EMAIL: ${{ secrets.BARBEROS_E2E_EMAIL }}
      BARBEROS_E2E_PASSWORD: ${{ secrets.BARBEROS_E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        working-directory: frontend
        run: corepack enable
      - name: Install frontend
        working-directory: frontend
        run: corepack yarn install --frozen-lockfile
      - name: Build production app
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID
        run: corepack yarn build
      - name: Install Playwright Chromium and Linux dependencies
        working-directory: frontend
        run: corepack yarn playwright install --with-deps chromium
      - name: Run smoke E2E
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID
          BARBEROS_E2E_SHOP_SLUG: oryon
          BARBEROS_E2E_EMAIL: ${{ secrets.BARBEROS_E2E_EMAIL }}
          BARBEROS_E2E_PASSWORD: ${{ secrets.BARBEROS_E2E_PASSWORD }}
        run: corepack yarn playwright test tests/e2e/phase23.spec.mjs --config=playwright.config.mjs
      - name: Run full lifecycle E2E when dedicated environment is provisioned
        if: ${{ env.BARBEROS_E2E_FULL == '1' && env.BARBEROS_E2E_FULL_RESET_URL != '' && env.BARBEROS_E2E_EMAIL != '' && env.BARBEROS_E2E_PASSWORD != '' }}
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID
        run: corepack yarn playwright test tests/e2e/phase23-full-lifecycle.spec.mjs --config=playwright.config.mjs

  database:
    name: Database acceptance suite (disposable Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BARBEROS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      BARBEROS_TEST_ALLOW_MUTATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start isolated Supabase and apply all migrations
        shell: bash
        run: |
          set -o pipefail
          supabase start --debug --exclude studio,imgproxy,inbucket,logflare,vector 2>&1 | tee "$RUNNER_TEMP/barberos-phase23-supabase.log" || {
            tail -n 120 "$RUNNER_TEMP/barberos-phase23-supabase.log"
            exit 1
          }
          supabase db reset
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psycopg
        run: pip install "psycopg[binary]==3.2.12"
      - name: Run database acceptance suite
        run: python scripts/test_database_phase23.py
      - name: Booking concurrency
        run: python scripts/test_booking_concurrency_phase23.py
      - name: Preserve database startup logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: barberos-phase23-database-logs
          path: ${{ runner.temp }}/barberos-phase23-supabase.log
          if-no-files-found: ignore
