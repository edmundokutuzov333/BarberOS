name: BarberOS Phase 25 Performance Gate

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/check-performance-budget.mjs"
      - "supabase/migrations/*phase_25*"
      - "supabase/tests/phase25_*"
      - "docs/PHASE25-PERFORMANCE.md"
      - ".github/workflows/phase25-performance.yml"
      - "package.json"
      - ".nvmrc"
  push:
    branches:
      - main
      - "phase-*"
    paths:
      - "frontend/**"
      - "scripts/check-performance-budget.mjs"
      - "supabase/migrations/*phase_25*"
      - "supabase/tests/phase25_*"
      - "docs/PHASE25-PERFORMANCE.md"
      - ".github/workflows/phase25-performance.yml"
      - "package.json"
      - ".nvmrc"

jobs:
  build-budget:
    name: Phase 25 asset budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile
      - run: corepack yarn build
      - run: corepack yarn perf:budget
      - run: corepack yarn test:contracts:phase25
      - run: corepack yarn typecheck

  public-3g:
    name: Phase 25 public Fast 3G
    runs-on: ubuntu-latest
    needs: build-budget
    env:
      VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID
      BARBEROS_E2E_SHOP_SLUG: oryon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: frontend
        run: corepack enable
      - working-directory: frontend
        run: corepack yarn install --frozen-lockfile
      - working-directory: frontend
        run: corepack yarn build
      - name: Install Playwright Chromium and Linux dependencies
        working-directory: frontend
        run: corepack yarn playwright install --with-deps chromium
      - name: Run public performance benchmark
        working-directory: frontend
        run: corepack yarn playwright test tests/e2e/phase25-performance.spec.mjs --config=playwright.config.mjs

  database-contract:
    name: Phase 25 database performance contract (disposable Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BARBEROS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start isolated Supabase and apply all migrations
        shell: bash
        run: |
          set -o pipefail
          supabase start --debug --exclude studio,imgproxy,inbucket,logflare,vector 2>&1 | tee "$RUNNER_TEMP/barberos-phase25-supabase.log" || {
            tail -n 120 "$RUNNER_TEMP/barberos-phase25-supabase.log"
            exit 1
          }
          supabase db reset
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]==3.2.12"
      - name: Run read-only performance contract and public RPC benchmark
        run: |
          python - <<'PY'
          import os
          import psycopg
          db = os.environ["BARBEROS_TEST_DATABASE_URL"]
          for filename in [
              "supabase/tests/phase25_performance_contract.sql",
              "supabase/tests/phase25_public_rpc_benchmark.sql",
          ]:
              with psycopg.connect(db, autocommit=True) as conn:
                  conn.execute(open(filename, encoding="utf-8").read())
              print("PASS | " + filename)
          PY
      - name: Preserve database startup logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: barberos-phase25-database-logs
          path: ${{ runner.temp }}/barberos-phase25-supabase.log
          if-no-files-found: ignore
