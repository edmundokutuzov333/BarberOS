name: BarberOS Native Releases
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'scripts/native/**'
      - 'frontend/public/barberos-icon.svg'
      - 'frontend/public/.well-known/assetlinks.json'
      - '.github/workflows/native-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: barberos-native-release
  cancel-in-progress: true
jobs:
  desktop:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac
            arch: arm64
          - os: macos-26-intel
            platform: mac
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NATIVE_VERSION: 1.0.${{ github.run_number }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: node scripts/native/generate-icons.cjs
      - run: npm test && npm audit --audit-level=moderate
        working-directory: apps/desktop
      - name: Stamp native version and source commit
        run: node scripts/native/stamp-release.cjs
      - run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        working-directory: apps/desktop
      - name: Verify macOS drag-and-drop installer
        if: matrix.platform == 'mac'
        run: bash scripts/native/macos-installer.sh
      - name: Verify Windows installation and shortcuts
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/native/windows-install.ps1
      - name: Exercise packaged application against production
        if: matrix.platform == 'mac'
        env:
          BARBEROS_EXECUTABLE: ${{ matrix.platform == 'mac' && format('{0}/apps/desktop/release/mac{1}/BarberOS.app/Contents/MacOS/BarberOS', github.workspace, matrix.arch == 'arm64' && '-arm64' || '') || format('{0}/apps/desktop/release/win-unpacked/BarberOS.exe', github.workspace) }}
        run: node test/runtime.cjs
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/runtime-evidence/**
          if-no-files-found: error
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NATIVE_VERSION: 1.0.${{ github.run_number }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/android/barberos-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
      - name: Android lint and signed reproducible release
        working-directory: apps/android
        run: bash gradlew --no-daemon lintRelease assembleRelease bundleRelease
      - name: Verify signature and published domain fingerprint
        run: node scripts/native/verify-android.cjs
      - name: Enable KVM on the disposable emulator runner
        run: sudo chmod a+rw /dev/kvm
      - name: Exercise installed APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/native/android-runtime.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/reports/lint-results-release.html
            apps/android/app/build/runtime-evidence/**
      - name: Remove signing material
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: native-artifacts
          merge-multiple: true
      - name: Publish immutable release with source provenance and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_VERSION: 1.0.${{ github.run_number }}
        run: node scripts/native/publish-release.cjs
