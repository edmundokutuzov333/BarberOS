name: BarberOS verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile
      - run: corepack yarn lint
      - run: corepack yarn typecheck
      - run: corepack yarn test
      - name: Verify production and explicitly scoped staging frontend contracts
        run: |
          node --test ../scripts/inventory-frontend-contracts.test.mjs ../scripts/compare-frontend-contracts.test.mjs
          node ../scripts/inventory-frontend-contracts.mjs > "$RUNNER_TEMP/frontend-contracts.json"
          node ../scripts/compare-frontend-contracts.mjs "$RUNNER_TEMP/frontend-contracts.json" ../docs/contracts/production-2026-11-24.json ../docs/contracts/payment-simulator-staging.json
      - run: corepack yarn build
      - run: corepack yarn perf:budget
      - name: Install Chromium for responsive route QA
        run: corepack yarn playwright install --with-deps chromium
      - name: Responsive route matrix (public read-only and authentication boundaries)
        run: corepack yarn playwright test tests/e2e/responsive-route-matrix.spec.mjs --project=chromium --workers=2
      - name: Upload responsive QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-route-qa
          path: frontend/playwright-report
          if-no-files-found: ignore

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-deployment-config.mjs
      - run: node scripts/verify-supabase-release.mjs
      - run: node scripts/verify-store-reference.mjs
      - run: node --test scripts/migration-archive.test.mjs
      - run: node --test scripts/compare-schema-manifests.test.mjs
      - run: node --test scripts/prepare-isolated-supabase.test.mjs
      - run: node --test scripts/rehearse-local-restore.test.mjs
      - run: node --test scripts/audit-supabase-migration-history.test.mjs
      - run: node --test scripts/migration-source-review.test.mjs
      - run: node --test scripts/test-membership-concurrency.test.mjs
      - run: node --test scripts/verify-reconciliation-bundle.test.mjs
      - run: node scripts/verify-reconciliation-bundle.mjs
      - name: Audit captured migration history without altering remote state
        run: node scripts/audit-supabase-migration-history.mjs --report-only
      - name: Secret scan
        run: node scripts/scan-repository-secrets.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Resend webhook signature verification
        run: deno test supabase/functions/resend-webhook/signature_test.ts
      - name: Test HTTP boundary and booking error contracts
        run: deno test supabase/functions/_shared/http_test.ts supabase/functions/_shared/account_test.ts supabase/functions/booking-create/contract.test.ts supabase/functions/health/configuration_test.ts
      - name: Typecheck integrations and signed webhook runtime
        run: deno check --node-modules-dir=auto supabase/functions/payment-simulator/index.ts supabase/functions/admin-credential-manager/index.ts supabase/functions/gmail-integration/index.ts supabase/functions/google-calendar/index.ts supabase/functions/resend-webhook/index.ts supabase/functions/notify-dispatch/index.ts
      - name: Test Calendar provider deadlines and idempotent event writes
        run: deno test supabase/functions/google-calendar/provider_test.ts
      - name: Test notification delivery failure transitions
        run: deno test supabase/functions/notify-dispatch/delivery_test.ts
      - name: Test Gmail reply recipients and conversation headers
        run: deno test supabase/functions/gmail-integration/reply_test.ts supabase/functions/gmail-integration/disconnect_test.ts

  database:
    name: Supabase migrations and security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BARBEROS_LOCAL_PROJECT_ID: barberos_ci_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Allocate isolated local identity and available ports
        run: node scripts/prepare-isolated-supabase.mjs
      - uses: supabase/setup-cli@v2
        with:
          version: 2.81.3
          github-token: ${{ github.token }}
      - name: Configure local browser origin for simulator acceptance
        run: printf 'ALLOWED_ORIGINS=http://127.0.0.1:4173\n' > supabase/functions/.env
      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -o pipefail
          supabase start --debug --exclude studio,imgproxy,mailpit,logflare,vector,supavisor 2>&1 | tee "$RUNNER_TEMP/barberos-supabase-start.log" || {
            tail -n 120 "$RUNNER_TEMP/barberos-supabase-start.log"
            exit 1
          }
      - name: Apply the complete migration chain from empty state
        run: supabase db reset
      - name: Verify versioned authorization reconciliation and idempotence
        shell: bash
        run: |
          DB_CONTAINER="supabase_db_$BARBEROS_LOCAL_PROJECT_ID"
          # Prove historical migration reapplication succeeds without persisting
          # old CREATE OR REPLACE definitions over newer forward migrations.
          # All following acceptance tests run against the actual latest schema.
          { printf 'begin;\n'; cat supabase/migrations/20261124044009_reconcile_application_authorization.sql; printf '\nrollback;\n'; } | docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/password_rotation_boundary.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/membership_boundary.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/review_public_contract_boundary.sql
          DOCKER_HOST=unix:///var/run/docker.sock node scripts/test-membership-concurrency.mjs "$DB_CONTAINER"
      - name: Run pgTAP security and core platform contracts
        run: |
          supabase test db \
            supabase/tests/platform_access_security.test.sql \
            supabase/tests/platform_core_contracts.test.sql \
            supabase/tests/resend_webhook_contract.test.sql \
            supabase/tests/gmail_storage_contract.test.sql
      - name: Run transactional shop domain contracts
        shell: bash
        run: |
          DB_CONTAINER="supabase_db_$BARBEROS_LOCAL_PROJECT_ID"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_domain_phase1.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_catalog_phase2.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_catalog_rules_phase2.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_communications_reporting_phase6.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_catalog_phase7.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/operational_settings_catalog_pricing.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/service_preparation_buffer.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/catalog_presentation_and_gross_margin.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_catalog_atomic_management.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_reference_catalog_provisioning.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/payments_unavailable_launch.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/payment_simulator.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/payment_operational_checkout.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_public_catalog_phase3.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_atomic_phase4.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_operations_phase5.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_workspace.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_phase7_pilot_day.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_payments_phase8.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_operational_lifecycle_e2e.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_phase8_incidents.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/booking_phone_boundary_audit.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/token_gateway_privilege_audit.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/reporting_boundary.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_partial_delivery_boundary.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/booking_gateway_foundation.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/booking_offer_consistency.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/booking_composition_acceptance.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/platform_admin_boundary.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/tenant_immutability_boundary.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/notification_channel_boundary.sql
      - name: Install browser acceptance dependencies
        working-directory: frontend
        run: |
          corepack enable
          corepack yarn install --frozen-lockfile
          corepack yarn playwright install --with-deps chromium
      - name: Real authenticated simulator HTTP, concurrency and browser (local only)
        env:
          BARBEROS_SIMULATOR_BROWSER: '1'
        run: node scripts/test-payment-simulator-http.mjs
      - name: Upload isolated authenticated layout QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-layout-qa
          path: frontend/test-results/authenticated-layout
          if-no-files-found: ignore
      - name: Run Phase 4 two-session stock reservation race
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="supabase_db_$BARBEROS_LOCAL_PROJECT_ID"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_concurrency_setup_phase4.sql
          set +e
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_concurrency_call_a_phase4.sql > "$RUNNER_TEMP/phase4-race-a.log" 2>&1 &
          PID_A=$!
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_concurrency_call_b_phase4.sql > "$RUNNER_TEMP/phase4-race-b.log" 2>&1 &
          PID_B=$!
          wait "$PID_A"
          STATUS_A=$?
          wait "$PID_B"
          STATUS_B=$?
          set -e
          if [[ "$STATUS_A" -eq 0 && "$STATUS_B" -ne 0 ]]; then
            FAILED_LOG="$RUNNER_TEMP/phase4-race-b.log"
          elif [[ "$STATUS_B" -eq 0 && "$STATUS_A" -ne 0 ]]; then
            FAILED_LOG="$RUNNER_TEMP/phase4-race-a.log"
          else
            cat "$RUNNER_TEMP/phase4-race-a.log"
            cat "$RUNNER_TEMP/phase4-race-b.log"
            echo "::error::Phase 4 race must have exactly one successful booking."
            exit 1
          fi
          if ! grep -q "SHOP_STOCK_UNAVAILABLE" "$FAILED_LOG"; then
            cat "$RUNNER_TEMP/phase4-race-a.log"
            cat "$RUNNER_TEMP/phase4-race-b.log"
            echo "::error::The losing concurrent request did not fail with SHOP_STOCK_UNAVAILABLE."
            exit 1
          fi
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_concurrency_assert_phase4.sql

  payment-simulator-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile
      - run: corepack yarn playwright install --with-deps chromium
      - run: corepack yarn test:e2e:payment-simulator

  payment-simulator-staging-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-payment-simulator-staging-smoke.mjs
