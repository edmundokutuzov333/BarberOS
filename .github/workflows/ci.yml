name: BarberOS verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile
      - run: corepack yarn lint
      - run: corepack yarn typecheck
      - run: corepack yarn test
      - run: corepack yarn build
      - run: corepack yarn perf:budget

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-deployment-config.mjs
      - run: node scripts/verify-supabase-release.mjs
      - name: Secret scan
        run: node scripts/scan-repository-secrets.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Resend webhook signature verification
        run: deno test supabase/functions/resend-webhook/signature_test.ts

  database:
    name: Supabase migrations and security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -o pipefail
          supabase start --debug --exclude studio,imgproxy,inbucket,logflare,vector 2>&1 | tee "$RUNNER_TEMP/barberos-supabase-start.log" || {
            tail -n 120 "$RUNNER_TEMP/barberos-supabase-start.log"
            exit 1
          }
      - name: Apply the complete migration chain from empty state
        run: supabase db reset
      - name: Run pgTAP security and core platform contracts
        run: |
          supabase test db \
            supabase/tests/platform_access_security.test.sql \
            supabase/tests/platform_core_contracts.test.sql \
            supabase/tests/resend_webhook_contract.test.sql
      - name: Run transactional shop domain contracts
        shell: bash
        run: |
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_domain_phase1.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_catalog_phase2.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_catalog_rules_phase2.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_communications_reporting_phase6.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_catalog_phase7.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_public_catalog_phase3.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_atomic_phase4.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_operations_phase5.sql
      - name: Run Phase 4 two-session stock reservation race
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep -E 'supabase_db_' | head -n1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_concurrency_setup_phase4.sql
          set +e
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_concurrency_call_a_phase4.sql > "$RUNNER_TEMP/phase4-race-a.log" 2>&1 &
          PID_A=$!
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_concurrency_call_b_phase4.sql > "$RUNNER_TEMP/phase4-race-b.log" 2>&1 &
          PID_B=$!
          wait "$PID_A"
          STATUS_A=$?
          wait "$PID_B"
          STATUS_B=$?
          set -e
          if [[ "$STATUS_A" -eq 0 && "$STATUS_B" -ne 0 ]]; then
            FAILED_LOG="$RUNNER_TEMP/phase4-race-b.log"
          elif [[ "$STATUS_B" -eq 0 && "$STATUS_A" -ne 0 ]]; then
            FAILED_LOG="$RUNNER_TEMP/phase4-race-a.log"
          else
            cat "$RUNNER_TEMP/phase4-race-a.log"
            cat "$RUNNER_TEMP/phase4-race-b.log"
            echo "::error::Phase 4 race must have exactly one successful booking."
            exit 1
          fi
          if ! grep -q "SHOP_STOCK_UNAVAILABLE" "$FAILED_LOG"; then
            cat "$RUNNER_TEMP/phase4-race-a.log"
            cat "$RUNNER_TEMP/phase4-race-b.log"
            echo "::error::The losing concurrent request did not fail with SHOP_STOCK_UNAVAILABLE."
            exit 1
          fi
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shop_order_concurrency_assert_phase4.sql
