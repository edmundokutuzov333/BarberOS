name: BarberOS Phase 24 Concurrency Gate

on:
  pull_request:
    paths:
      - "frontend/src/features/booking/**"
      - "frontend/src/pages/BookingWizard.tsx"
      - "frontend/src/lib/utils.ts"
      - "frontend/tests/unit/phase24-concurrency.mjs"
      - "frontend/tests/components/phase24-concurrency-contracts.mjs"
      - "frontend/tests/e2e/phase24-http-concurrency.spec.mjs"
      - "frontend/playwright.http.config.mjs"
      - "supabase/tests/shop_order_concurrency_setup_phase4.sql"
      - "supabase/tests/shop_order_concurrency_call_a_phase4.sql"
      - "supabase/tests/shop_order_concurrency_call_b_phase4.sql"
      - "supabase/functions/booking-create/**"
      - "supabase/tests/phase24_concurrency_contract.sql"
      - "scripts/test_booking_concurrency_phase24.py"
      - "docs/PHASE24-CONCURRENCY.md"
      - "frontend/package.json"
      - ".github/workflows/phase24-concurrency.yml"
      - "package.json"
      - ".nvmrc"
  push:
    branches:
      - main
      - "phase-*"
    paths:
      - "frontend/src/features/booking/**"
      - "frontend/src/pages/BookingWizard.tsx"
      - "frontend/src/lib/utils.ts"
      - "frontend/tests/unit/phase24-concurrency.mjs"
      - "frontend/tests/components/phase24-concurrency-contracts.mjs"
      - "frontend/tests/e2e/phase24-http-concurrency.spec.mjs"
      - "frontend/playwright.http.config.mjs"
      - "supabase/tests/shop_order_concurrency_setup_phase4.sql"
      - "supabase/tests/shop_order_concurrency_call_a_phase4.sql"
      - "supabase/tests/shop_order_concurrency_call_b_phase4.sql"
      - "supabase/functions/booking-create/**"
      - "supabase/tests/phase24_concurrency_contract.sql"
      - "scripts/test_booking_concurrency_phase24.py"
      - "docs/PHASE24-CONCURRENCY.md"
      - "frontend/package.json"
      - ".github/workflows/phase24-concurrency.yml"
      - "package.json"
      - ".nvmrc"

jobs:
  frontend:
    name: Phase 24 frontend concurrency contracts
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://asikuyxaapcmayptimxi.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rjwoRrbWYYaEzLjOPy64pg_vtG9NGxZ
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile
      - name: Unit concurrency tests
        run: corepack yarn test:unit:phase24
      - name: Page concurrency contracts
        run: corepack yarn test:contracts:phase24
      - name: Typecheck
        run: corepack yarn typecheck
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID
        run: corepack yarn build

  edge-function-contract:
    name: Phase 24 Edge Function contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run booking conflict contract tests
        working-directory: supabase/functions/booking-create
        run: deno test --no-check contract.test.ts

  database-concurrency:
    name: Phase 24 database concurrency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start isolated local Supabase
        run: supabase start --exclude studio,imgproxy,inbucket,logflare,vector
      - name: Reset isolated database from versioned migrations
        run: supabase db reset
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psycopg
        run: pip install "psycopg[binary]==3.2.12"
      - name: Run read-only database concurrency contract
        env:
          BARBEROS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          python - <<'PY'
          import os
          import psycopg
          db = os.environ["BARBEROS_TEST_DATABASE_URL"]
          sql = open("supabase/tests/phase24_concurrency_contract.sql", encoding="utf-8").read()
          with psycopg.connect(db, autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute(sql)
          print("PASS | Phase 24 database concurrency contract")
          PY
      - name: Run deterministic concurrent booking acceptance
        env:
          BARBEROS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          BARBEROS_TEST_ALLOW_MUTATION: "1"
        run: |
          python scripts/test_booking_concurrency_phase24.py

  http-concurrency:
    name: Phase 24 HTTP 200/409 concurrency
    runs-on: ubuntu-latest
    needs:
      - frontend
    env:
      BARBEROS_E2E_CONCURRENCY_URL: https://asikuyxaapcmayptimxi.supabase.co/functions/v1/booking-create
      BARBEROS_E2E_CONCURRENCY_SLUG: theme-v2-qa
      BARBEROS_E2E_CONCURRENCY_SERVICE_ID: 158a79dc-2405-40f7-8c19-fe54b15ee145
      BARBEROS_E2E_CONCURRENCY_BARBER_ID: d6b53c2f-2d49-430b-82fe-8f39ded89dfb
      VITE_SUPABASE_URL: https://asikuyxaapcmayptimxi.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rjwoRrbWYYaEzLjOPy64pg_vtG9NGxZ
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.56.1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Resolve a free staging slot
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = process.env.VITE_SUPABASE_URL;
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY;
          const slug = process.env.BARBEROS_E2E_CONCURRENCY_SLUG;
          const serviceId = process.env.BARBEROS_E2E_CONCURRENCY_SERVICE_ID;
          const barberId = process.env.BARBEROS_E2E_CONCURRENCY_BARBER_ID;
          let chosen = null;
          for (let offset = 2; offset <= 21 && !chosen; offset += 1) {
            const day = new Date(Date.now() + offset * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
            const response = await fetch(base + '/rest/v1/rpc/get_available_slots', {
              method: 'POST',
              headers: { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' },
              body: JSON.stringify({ p_slug: slug, p_service_id: serviceId, p_barber_id: barberId, p_date: day }),
            });
            if (!response.ok) throw new Error('STAGING_AVAILABILITY_RPC_FAILED:' + response.status + ':' + await response.text());
            const rows = await response.json();
            chosen = Array.isArray(rows) ? rows.find((row) => Date.parse(row.slot_start) > Date.now() + 30 * 60 * 1000) : null;
          }
          if (!chosen) throw new Error('STAGING_CONCURRENCY_SLOT_UNAVAILABLE');
          fs.appendFileSync(process.env.GITHUB_ENV, 'BARBEROS_E2E_CONCURRENCY_START=' + chosen.slot_start + '\n');
          console.log('Resolved staging slot:', chosen.slot_start);
          NODE
      - name: Run HTTP concurrency acceptance against staging
        working-directory: frontend
        run: npx playwright test tests/e2e/phase24-http-concurrency.spec.mjs --config=playwright.http.config.mjs
