name: BarberOS Phase 24 Concurrency Gate

on:
  pull_request:
    paths:
      - "frontend/src/features/booking/**"
      - "frontend/src/pages/BookingWizard.tsx"
      - "frontend/src/lib/utils.ts"
      - "frontend/tests/unit/phase24-concurrency.mjs"
      - "frontend/tests/components/phase24-concurrency-contracts.mjs"
      - "frontend/tests/e2e/phase24-http-concurrency.spec.mjs"
      - "frontend/playwright.http.config.mjs"
      - "supabase/tests/shop_order_concurrency_setup_phase4.sql"
      - "supabase/tests/shop_order_concurrency_call_a_phase4.sql"
      - "supabase/tests/shop_order_concurrency_call_b_phase4.sql"
      - "supabase/functions/booking-create/**"
      - "supabase/tests/phase24_concurrency_contract.sql"
      - "scripts/test_booking_concurrency_phase24.py"
      - "docs/PHASE24-CONCURRENCY.md"
      - "frontend/package.json"
      - ".github/workflows/phase24-concurrency.yml"
      - "package.json"
      - ".nvmrc"
  push:
    branches:
      - main
      - "phase-*"
    paths:
      - "frontend/src/features/booking/**"
      - "frontend/src/pages/BookingWizard.tsx"
      - "frontend/src/lib/utils.ts"
      - "frontend/tests/unit/phase24-concurrency.mjs"
      - "frontend/tests/components/phase24-concurrency-contracts.mjs"
      - "frontend/tests/e2e/phase24-http-concurrency.spec.mjs"
      - "frontend/playwright.http.config.mjs"
      - "supabase/tests/shop_order_concurrency_setup_phase4.sql"
      - "supabase/tests/shop_order_concurrency_call_a_phase4.sql"
      - "supabase/tests/shop_order_concurrency_call_b_phase4.sql"
      - "supabase/functions/booking-create/**"
      - "supabase/tests/phase24_concurrency_contract.sql"
      - "scripts/test_booking_concurrency_phase24.py"
      - "docs/PHASE24-CONCURRENCY.md"
      - "frontend/package.json"
      - ".github/workflows/phase24-concurrency.yml"
      - "package.json"
      - ".nvmrc"

jobs:
  frontend:
    name: Phase 24 frontend concurrency contracts
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://asikuyxaapcmayptimxi.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rjwoRrbWYYaEzLjOPy64pg_vtG9NGxZ
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile
      - name: Unit concurrency tests
        run: corepack yarn test:unit:phase24
      - name: Page concurrency contracts
        run: corepack yarn test:contracts:phase24
      - name: Typecheck
        run: corepack yarn typecheck
      - name: Production build
        env:
          VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID
        run: corepack yarn build

  edge-function-contract:
    name: Phase 24 Edge Function contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run booking conflict contract tests
        working-directory: supabase/functions/booking-create
        run: deno test --no-check contract.test.ts

  database-concurrency:
    name: Phase 24 database concurrency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start isolated local Supabase
        run: supabase start --exclude studio,imgproxy,inbucket,logflare,vector
      - name: Reset isolated database from versioned migrations
        run: supabase db reset
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psycopg
        run: pip install "psycopg[binary]==3.2.12"
      - name: Run read-only database concurrency contract
        env:
          BARBEROS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          python - <<'PY'
          import os
          import psycopg
          db = os.environ["BARBEROS_TEST_DATABASE_URL"]
          sql = open("supabase/tests/phase24_concurrency_contract.sql", encoding="utf-8").read()
          with psycopg.connect(db, autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute(sql)
          print("PASS | Phase 24 database concurrency contract")
          PY
      - name: Run deterministic concurrent booking acceptance
        env:
          BARBEROS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          BARBEROS_TEST_ALLOW_MUTATION: "1"
        run: |
          python scripts/test_booking_concurrency_phase24.py

  http-concurrency:
    name: Phase 24 HTTP 200/409 concurrency
    needs:
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start isolated local Supabase
        run: supabase start --exclude studio,imgproxy,inbucket,logflare,vector
      - name: Reset isolated database from versioned migrations
        run: supabase db reset
      - name: Prepare local test environment
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          cat > "$RUNNER_TEMP/phase24-functions.env" <<'ENV'
          RATE_LIMIT_SALT=phase24-local-ci-only-rate-limit-salt
          ALLOWED_ORIGINS=http://127.0.0.1:54321
          ENV
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "BARBEROS_E2E_CONCURRENCY_URL=$API_URL/functions/v1/booking-create" >> "$GITHUB_ENV"
          echo "BARBEROS_E2E_CONCURRENCY_SKIP_CLEANUP=1" >> "$GITHUB_ENV"
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep -E 'supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/phase24_http_concurrency_setup.sql
          FIXTURE="$(docker exec "$DB_CONTAINER" psql -U postgres -d postgres -At -F '|' -c "select slug, service_id, barber_id, slot_start from private.phase24_http_concurrency_fixture where singleton")"
          IFS='|' read -r SHOP_SLUG SERVICE_ID BARBER_ID SLOT_START <<< "$FIXTURE"
          test -n "$SHOP_SLUG" && test -n "$SERVICE_ID" && test -n "$BARBER_ID" && test -n "$SLOT_START"
          {
            echo "BARBEROS_E2E_CONCURRENCY_SLUG=$SHOP_SLUG"
            echo "BARBEROS_E2E_CONCURRENCY_SERVICE_ID=$SERVICE_ID"
            echo "BARBEROS_E2E_CONCURRENCY_BARBER_ID=$BARBER_ID"
            echo "BARBEROS_E2E_CONCURRENCY_START=$SLOT_START"
          } >> "$GITHUB_ENV"
      - name: Serve local Edge Functions for concurrency tests
        run: |
          supabase functions serve booking-create --env-file "$RUNNER_TEMP/phase24-functions.env" --no-verify-jwt > "$RUNNER_TEMP/phase24-functions.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/phase24-functions.pid"
          for attempt in $(seq 1 45); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X OPTIONS "$BARBEROS_E2E_CONCURRENCY_URL" || true)"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/phase24-functions.log"
          exit 1
      - name: Install Playwright runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test@1.56.1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run HTTP concurrency acceptance against isolated local functions
        working-directory: frontend
        run: npx playwright test tests/e2e/phase24-http-concurrency.spec.mjs --config=playwright.http.config.mjs
