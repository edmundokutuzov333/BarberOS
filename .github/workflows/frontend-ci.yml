name: BarberOS frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/check-performance-budget.mjs"
      - "scripts/verify-supabase-release.mjs"
      - "docs/TESTING.md"
      - ".gitignore"
      - ".github/workflows/frontend-ci.yml"
      - "package.json"
      - ".nvmrc"
  push:
    branches:
      - main
      - "phase-*"
    paths:
      - "frontend/**"
      - "scripts/check-performance-budget.mjs"
      - "scripts/verify-supabase-release.mjs"
      - "docs/TESTING.md"
      - ".gitignore"
      - ".github/workflows/frontend-ci.yml"
      - "package.json"
      - ".nvmrc"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Phase 21 accessibility audit
        run: corepack yarn a11y:phase21

      - name: Typecheck
        run: corepack yarn typecheck

      - name: Production build
        env:
          VITE_SUPABASE_URL: https://alseiinjzwjdiwtvkdzy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cjn-g6cWrIUSYVI5oeK2ZA_Ipk0B5ID
        run: corepack yarn build

      - name: Install Playwright Chromium and Linux dependencies
        run: corepack yarn playwright install --with-deps chromium

      - name: Browser smoke and serious/critical accessibility tests (desktop and mobile)
        run: corepack yarn test:e2e:smoke

      - name: Production asset budget
        run: corepack yarn perf:budget
