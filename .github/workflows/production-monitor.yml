name: BarberOS production monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-monitor.yml"

permissions:
  contents: read

concurrency:
  group: barberos-production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Public site and backend health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public routes and security headers
        env:
          BARBEROS_PUBLIC_URL: https://barber-os-orpin.vercel.app
        run: node scripts/verify-production.mjs
      - name: Check Supabase health and token gateway
        shell: bash
        run: |
          set -euo pipefail
          base="https://alseiinjzwjdiwtvkdzy.supabase.co/functions/v1"
          health="$(curl --retry 2 --retry-delay 2 --retry-all-errors --max-time 15 --silent --show-error --fail "$base/health")"
          printf '%s' "$health" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              let value;
              try { value = JSON.parse(input); } catch {
                console.error("Supabase health returned invalid JSON");
                process.exit(1);
              }
              if (value.ok !== true ||
                  typeof value.db_ms !== "number" ||
                  typeof value.version !== "string" ||
                  value.version === "unknown") {
                console.error("Supabase health contract failed");
                process.exit(1);
              }
              console.log("PASS | Supabase health | database roundtrip " + value.db_ms + " ms");
            });
          '
          gateway_status="$(curl --retry 2 --retry-delay 2 --retry-all-errors --max-time 15 --silent --show-error --output /dev/null --write-out '%{http_code}' --request OPTIONS "$base/token-gateway" --header 'Origin: https://barber-os-orpin.vercel.app' --header 'Access-Control-Request-Method: POST')"
          if [ "$gateway_status" != "200" ]; then
            echo "::error::token-gateway is not ready (HTTP $gateway_status)"
            exit 1
          fi
          echo "PASS | token-gateway OPTIONS"
      - name: Write monitoring summary
        if: success()
        run: |
          {
            echo "## BarberOS production monitor"
            echo
            echo "- Public routes and security headers passed."
            echo "- Supabase health and token-gateway passed."
            echo "- Timestamp: $(date -u +%FT%TZ)"
          } >> "$GITHUB_STEP_SUMMARY"
