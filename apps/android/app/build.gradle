plugins { id 'com.android.application' }
android {
    namespace 'app.barberos.mobile'
    compileSdk { version = release(37) { minorApiLevel = 0 } }
    buildToolsVersion '37.0.0'
    defaultConfig {
        applicationId 'app.barberos.mobile'
        minSdk 24
        targetSdk 37
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName System.getenv('NATIVE_VERSION') ?: '1.0.0'
        manifestPlaceholders = [sourceCommit: System.getenv('GITHUB_SHA') ?: 'local']
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: '../barberos-release.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias 'barberos'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; warningsAsErrors true }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4' }
