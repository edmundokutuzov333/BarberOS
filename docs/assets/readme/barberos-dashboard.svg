<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">BarberOS interface visual</title><desc id="desc">Ilustração de interface escura do BarberOS, com navegação lateral, indicadores, agenda e gráfico, seguindo o tema noir e latão. Não representa dados de produção.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11100c"/><stop offset=".55" stop-color="#080807"/><stop offset="1" stop-color="#171208"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfc27b"/><stop offset="1" stop-color="#9c7739"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#191710"/><stop offset="1" stop-color="#0e0d0a"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#b9964f" stop-opacity=".18"/><stop offset="1" stop-color="#b9964f" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#dfc27b" stroke-opacity=".045" stroke-width="1"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
