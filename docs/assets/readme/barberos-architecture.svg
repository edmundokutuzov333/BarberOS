<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura visual do BarberOS</title><desc id="desc">Mapa da arquitectura lógica do BarberOS desde o browser e camada React até às RPCs e Edge Functions, PostgreSQL com RLS, Realtime, jobs e providers externos.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11100c"/><stop offset="1" stop-color="#070706"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dfc27b"/><stop offset="1" stop-color="#9a773b"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#b9964f"/></marker></defs>
<rect width="1200" height="525" rx="22" fill="url(#bg)" stroke="#dfc27b" stroke-opacity=".25"/>
<text x="32" y="38" fill="#f7f4ec" font-family="Arial,sans-serif" font-size="20" font-weight="700">Arquitectura do sistema</text><text x="32" y="59" fill="#777162" font-family="Arial,sans-serif" font-size="11">O frontend coordena a experiência; o domínio e as fronteiras server-side aplicam as regras críticas</text>
<g font-family="Arial,sans-serif">
 <rect x="35" y="92" width="220" height="75" rx="13" fill="#17150f" stroke="#dfc27b" stroke-opacity=".5"/><text x="55" y="119" fill="#dfc27b" font-weight="700" font-size="14">Browser / PWA</text><text x="55" y="139" fill="#aca698" font-size="11">React · React Router</text><text x="55" y="154" fill="#777162" font-size="10">Apresentação e navegação</text>
 <rect x="315" y="92" width="230" height="75" rx="13" fill="#17150f" stroke="#dfc27b" stroke-opacity=".5"/><text x="335" y="119" fill="#dfc27b" font-weight="700" font-size="14">Features e APIs</text><text x="335" y="139" fill="#aca698" font-size="11">TanStack Query · DTOs</text><text x="335" y="154" fill="#777162" font-size="10">Cache e coordenação</text>
 <rect x="605" y="92" width="260" height="75" rx="13" fill="#17150f" stroke="#dfc27b" stroke-opacity=".5"/><text x="625" y="119" fill="#dfc27b" font-weight="700" font-size="14">Fronteiras server-side</text><text x="625" y="139" fill="#aca698" font-size="11">RPCs · Edge Functions</text><text x="625" y="154" fill="#777162" font-size="10">Validação, tokens e integrações</text>
 <rect x="925" y="92" width="240" height="75" rx="13" fill="#241d0f" stroke="#dfc27b" stroke-opacity=".8"/><text x="945" y="119" fill="#dfc27b" font-weight="700" font-size="14">PostgreSQL</text><text x="945" y="139" fill="#f7f4ec" font-size="11">Fonte de verdade</text><text x="945" y="154" fill="#aca698" font-size="10">Transacções e invariantes</text>
 <g stroke="#b9964f" stroke-opacity=".9" stroke-width="1.8" fill="none" marker-end="url(#arrow)"><path d="M255 129H308"/><path d="M545 129H598"/><path d="M865 129H918"/></g>
 <g fill="#777162" font-size="9"><text x="263" y="119">HTTPS</text><text x="554" y="119">RPC / HTTP</text><text x="871" y="119">SQL</text></g>
 <rect x="905" y="201" width="278" height="113" rx="14" fill="#14130f" stroke="#dfc27b" stroke-opacity=".35"/><text x="925" y="226" fill="#f7f4ec" font-weight="700" font-size="13">Segurança do domínio</text>
 <g fill="#aca698" font-size="11"><circle cx="928" cy="247" r="3" fill="#dfc27b"/><text x="940" y="251">RLS e grants explícitos</text><circle cx="928" cy="269" r="3" fill="#dfc27b"/><text x="940" y="273">Constraints e transacções</text><circle cx="928" cy="291" r="3" fill="#dfc27b"/><text x="940" y="295">SECURITY DEFINER controlado</text></g>
 <path d="M1045 167V193" stroke="#b9964f" stroke-width="1.7" marker-end="url(#arrow)" fill="none"/>
 <rect x="35" y="223" width="250" height="92" rx="14" fill="#14130f" stroke="#dfc27b" stroke-opacity=".26"/><text x="55" y="249" fill="#dfc27b" font-weight="700" font-size="13">Supabase Auth</text><text x="55" y="270" fill="#aca698" font-size="11">Sessão e identidade</text><text x="55" y="290" fill="#777162" font-size="10">Autenticação e acesso controlado</text>
 <rect x="315" y="223" width="250" height="92" rx="14" fill="#14130f" stroke="#dfc27b" stroke-opacity=".26"/><text x="335" y="249" fill="#dfc27b" font-weight="700" font-size="13">Supabase Realtime</text><text x="335" y="270" fill="#aca698" font-size="11">Actualizações operacionais</text><text x="335" y="290" fill="#777162" font-size="10">Eventos de dados autorizados</text>
 <rect x="595" y="223" width="270" height="92" rx="14" fill="#14130f" stroke="#dfc27b" stroke-opacity=".26"/><text x="615" y="249" fill="#dfc27b" font-weight="700" font-size="13">Jobs temporais</text><text x="615" y="270" fill="#aca698" font-size="11">pg_cron · pg_net · Vault</text><text x="615" y="290" fill="#777162" font-size="10">Expiração, retries e reconciliação</text>
 <path d="M415 167V215M690 167V215M415 167H284V215" stroke="#b9964f" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="4 5" fill="none" marker-end="url(#arrow)"/>
 <rect x="35" y="352" width="830" height="130" rx="15" fill="#100f0c" stroke="#dfc27b" stroke-opacity=".22"/>
 <text x="55" y="378" fill="#f7f4ec" font-weight="700" font-size="13">Serviços externos</text><text x="55" y="396" fill="#777162" font-size="10">Disponibilidade condicionada à configuração e aos secrets do ambiente</text>
 <g>
  <rect x="55" y="415" width="175" height="43" rx="9" fill="#1a1710" stroke="#dfc27b" stroke-opacity=".18"/><text x="70" y="441" fill="#dfc27b" font-size="12">Email · Resend</text>
  <rect x="245" y="415" width="175" height="43" rx="9" fill="#1a1710" stroke="#dfc27b" stroke-opacity=".18"/><text x="260" y="441" fill="#dfc27b" font-size="12">WhatsApp</text>
  <rect x="435" y="415" width="175" height="43" rx="9" fill="#1a1710" stroke="#dfc27b" stroke-opacity=".18"/><text x="450" y="441" fill="#dfc27b" font-size="12">M-Pesa · e-Mola</text>
  <rect x="625" y="415" width="215" height="43" rx="9" fill="#1a1710" stroke="#dfc27b" stroke-opacity=".18"/><text x="640" y="441" fill="#dfc27b" font-size="12">Anti-bot · Turnstile</text>
 </g>
 <path d="M735 167V184H450V344" fill="none" stroke="#b9964f" stroke-opacity=".65" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
 <rect x="905" y="352" width="278" height="130" rx="15" fill="#14130f" stroke="#dfc27b" stroke-opacity=".26"/><text x="925" y="378" fill="#f7f4ec" font-weight="700" font-size="13">Regra fundamental</text><text x="925" y="402" fill="#aca698" font-size="11">UI não substitui autorização</text><text x="925" y="420" fill="#aca698" font-size="11">do servidor nem invariantes</text><text x="925" y="438" fill="#aca698" font-size="11">transaccionais da base de dados.</text><path d="M925 454H1160" stroke="#dfc27b" stroke-opacity=".28"/>
</g></svg>