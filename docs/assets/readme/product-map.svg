<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Mapa visual do produto BarberOS</title><desc id="desc">Três áreas de utilização do BarberOS: experiência pública, espaço de gestão da barbearia e administração da plataforma.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11100c"/><stop offset="1" stop-color="#070706"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfc27b"/><stop offset="1" stop-color="#9b783e"/></linearGradient></defs>
<rect width="1200" height="330" rx="22" fill="url(#bg)" stroke="#dfc27b" stroke-opacity=".25"/>
<text x="32" y="39" fill="#f7f4ec" font-family="Arial,sans-serif" font-weight="700" font-size="20">Um produto, três contextos de utilização</text><text x="32" y="59" fill="#777162" font-family="Arial,sans-serif" font-size="11">Acesso público, operação diária e controlo da plataforma</text>
<g transform="translate(30 83)">
 <rect width="360" height="215" rx="16" fill="#14130f" stroke="#dfc27b" stroke-opacity=".20"/><rect width="360" height="5" rx="2.5" fill="url(#gold)"/>
 <circle cx="30" cy="35" r="14" fill="#dfc27b" fill-opacity=".13" stroke="#b9964f" stroke-opacity=".6"/><path d="M24 35h12m-6-6v12" stroke="#dfc27b" stroke-width="1.5" stroke-linecap="round"/>
 <text x="54" y="33" fill="#f7f4ec" font-family="Arial,sans-serif" font-weight="700" font-size="15">Experiência pública</text><text x="54" y="49" fill="#aca698" font-family="Arial,sans-serif" font-size="10">Cliente sem conta</text>
 <g font-family="Arial,sans-serif" font-size="11" fill="#aca698"><rect x="18" y="68" width="324" height="30" rx="8" fill="#dfc27b" fill-opacity=".06"/><circle cx="31" cy="83" r="3" fill="#dfc27b"/><text x="43" y="87">Descobrir serviços, cortes e equipa</text><rect x="18" y="105" width="324" height="30" rx="8" fill="#dfc27b" fill-opacity=".06"/><circle cx="31" cy="120" r="3" fill="#dfc27b"/><text x="43" y="124">Escolher horário e fazer marcação</text><rect x="18" y="142" width="324" height="30" rx="8" fill="#dfc27b" fill-opacity=".06"/><circle cx="31" cy="157" r="3" fill="#dfc27b"/><text x="43" y="161">Gerir a marcação através de token</text></g>
 <rect x="18" y="183" width="111" height="20" rx="10" fill="#dfc27b" fill-opacity=".13" stroke="#b9964f" stroke-opacity=".3"/><text x="32" y="197" fill="#dfc27b" font-family="Arial,sans-serif" font-size="10">Público</text>
</g>
<g transform="translate(420 83)">
 <rect width="360" height="215" rx="16" fill="#14130f" stroke="#dfc27b" stroke-opacity=".20"/><rect width="360" height="5" rx="2.5" fill="url(#gold)"/>
 <circle cx="30" cy="35" r="14" fill="#dfc27b" fill-opacity=".13" stroke="#b9964f" stroke-opacity=".6"/><rect x="23" y="28" width="14" height="14" rx="3" fill="none" stroke="#dfc27b" stroke-width="1.3"/><path d="M23 33h14" stroke="#dfc27b" stroke-width="1.3"/>
 <text x="54" y="33" fill="#f7f4ec" font-family="Arial,sans-serif" font-weight="700" font-size="15">Espaço da barbearia</text><text x="54" y="49" fill="#aca698" font-family="Arial,sans-serif" font-size="10">Owner · Manager · Barber</text>
 <g font-family="Arial,sans-serif" font-size="11" fill="#aca698"><rect x="18" y="68" width="324" height="30" rx="8" fill="#dfc27b" fill-opacity=".06"/><circle cx="31" cy="83" r="3" fill="#dfc27b"/><text x="43" y="87">Operar agenda e marcações</text><rect x="18" y="105" width="324" height="30" rx="8" fill="#dfc27b" fill-opacity=".06"/><circle cx="31" cy="120" r="3" fill="#dfc27b"/><text x="43" y="124">Gerir clientes, catálogo e equipa</text><rect x="18" y="142" width="324" height="30" rx="8" fill="#dfc27b" fill-opacity=".06"/><circle cx="31" cy="157" r="3" fill="#dfc27b"/><text x="43" y="161">Consultar relatórios e notificações</text></g>
 <rect x="18" y="183" width="111" height="20" rx="10" fill="#dfc27b" fill-opacity=".13" stroke="#b9964f" stroke-opacity=".3"/><text x="32" y="197" fill="#dfc27b" font-family="Arial,sans-serif" font-size="10">Autenticado</text>
</g>
<g transform="translate(810 83)">
 <rect width="360" height="215" rx="16" fill="#14130f" stroke="#dfc27b" stroke-opacity=".20"/><rect width="360" height="5" rx="2.5" fill="url(#gold)"/>
 <circle cx="30" cy="35" r="14" fill="#dfc27b" fill-opacity=".13" stroke="#b9964f" stroke-opacity=".6"/><path d="M23 29h14v12H23zM26 26h8" stroke="#dfc27b" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
 <text x="54" y="33" fill="#f7f4ec" font-family="Arial,sans-serif" font-weight="700" font-size="15">Administração</text><text x="54" y="49" fill="#aca698" font-family="Arial,sans-serif" font-size="10">Platform Admin</text>
 <g font-family="Arial,sans-serif" font-size="11" fill="#aca698"><rect x="18" y="68" width="324" height="30" rx="8" fill="#dfc27b" fill-opacity=".06"/><circle cx="31" cy="83" r="3" fill="#dfc27b"/><text x="43" y="87">Operar barbearias e utilizadores</text><rect x="18" y="105" width="324" height="30" rx="8" fill="#dfc27b" fill-opacity=".06"/><circle cx="31" cy="120" r="3" fill="#dfc27b"/><text x="43" y="124">Gerir planos e pagamentos</text><rect x="18" y="142" width="324" height="30" rx="8" fill="#dfc27b" fill-opacity=".06"/><circle cx="31" cy="157" r="3" fill="#dfc27b"/><text x="43" y="161">Acompanhar suporte e métricas</text></g>
 <rect x="18" y="183" width="111" height="20" rx="10" fill="#dfc27b" fill-opacity=".13" stroke="#b9964f" stroke-opacity=".3"/><text x="32" y="197" fill="#dfc27b" font-family="Arial,sans-serif" font-size="10">Administração</text>
</g></svg>